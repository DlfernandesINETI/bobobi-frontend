<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bumblebee</title>
<style>
  :root {
    --bg: #14121f;
    --bg-soft: #1e1b2e;
    --panel: #26223a;
    --accent: #ff8a3d;
    --accent-soft: #ffb066;
    --wake: #7c6fe0;
    --listen: #4fd6c4;
    --think: #ffd166;
    --speak: #ff8a3d;
    --error: #ff5d5d;
    --text: #f5f2ff;
    --text-dim: #a89fc7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    -webkit-tap-highlight-color: transparent;
  }

  .brand {
    position: absolute;
    top: 20px;
    left: 24px;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: 100%;
    max-width: 420px;
  }

  .orb-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.08);
    transition: border-color 0.4s ease;
  }

  .ring.active { animation: pulse-ring 1.6s ease-out infinite; }

  @keyframes pulse-ring {
    0%   { transform: scale(0.92); opacity: 0.9; }
    70%  { transform: scale(1.25); opacity: 0; }
    100% { transform: scale(1.25); opacity: 0; }
  }

  .orb {
    position: relative;
    width: 168px;
    height: 168px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cabdff, var(--wake) 60%, #4c3fa8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    transition: background 0.4s ease, transform 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .orb:active { transform: scale(0.97); }

  .orb-icon {
    width: 56px;
    height: 56px;
    fill: rgba(20, 18, 31, 0.85);
  }

  body[data-state="wake_listen"] .orb {
    background: radial-gradient(circle at 35% 30%, #cabdff, var(--wake) 60%, #4c3fa8 100%);
  }
  body[data-state="wake_listen"] .ring.active { border-color: var(--wake); }

  body[data-state="recording"] .orb {
    background: radial-gradient(circle at 35% 30%, #8ff5e6, var(--listen) 60%, #16a08f 100%);
  }
  body[data-state="recording"] .ring.active { border-color: var(--listen); }

  body[data-state="thinking"] .orb {
    background: radial-gradient(circle at 35% 30%, #ffe9a8, var(--think) 60%, #c99a1c 100%);
    animation: think-spin 1.1s linear infinite;
  }
  body[data-state="thinking"] .ring.active { border-color: var(--think); }
  @keyframes think-spin {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.25); }
  }

  body[data-state="speaking"] .orb {
    background: radial-gradient(circle at 35% 30%, var(--accent-soft), var(--speak) 60%, #c9591a 100%);
    animation: speak-bounce 0.5s ease-in-out infinite;
  }
  body[data-state="speaking"] .ring.active { border-color: var(--speak); }
  @keyframes speak-bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }

  body[data-state="error"] .orb {
    background: radial-gradient(circle at 35% 30%, #ffb3b3, var(--error) 60%, #a83030 100%);
  }

  .status-label {
    font-size: 20px;
    font-weight: 600;
    min-height: 28px;
    text-align: center;
  }

  .status-sub {
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
    min-height: 18px;
    max-width: 340px;
  }

  .boot-btn {
    padding: 16px 32px;
    border-radius: 999px;
    background: var(--accent);
    color: #14121f;
    font-size: 16px;
    font-weight: 700;
    border: none;
    cursor: pointer;
  }

  .volume-meter {
    width: 160px;
    height: 6px;
    background: var(--bg-soft);
    border-radius: 4px;
    overflow: hidden;
  }
  .volume-fill {
    height: 100%;
    width: 0%;
    background: var(--listen);
    transition: width 0.08s linear;
  }

  .config {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 460px;
  }
  .config summary {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    cursor: pointer;
    list-style: none;
    padding: 6px;
  }
  .config summary::-webkit-details-marker { display: none; }

  .config-panel {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 40vh;
    overflow-y: auto;
  }

  .config-panel label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }

  .config-panel input, .config-panel select {
    background: var(--bg-soft);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
    width: 100%;
  }

  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }

  .save-btn {
    margin-top: 4px;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #14121f;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .save-btn.saved {
    background: var(--listen);
  }

  .transcript-debug {
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg-soft);
    border-radius: 8px;
    padding: 8px 10px;
    min-height: 32px;
    word-break: break-word;
  }

  audio { display: none; }
</style>
</head>
<body data-state="boot">

  <div class="brand">Bumblebee</div>

  <div class="stage">
    <div class="orb-wrap">
      <div class="ring" id="ring"></div>
      <button class="orb" id="orbButton" aria-label="Bumblebee" style="display:none;">
        <svg class="orb-icon" id="orbIcon" viewBox="0 0 24 24">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
        </svg>
      </button>
    </div>

    <div>
      <div class="status-label" id="statusLabel">Toque para ligar o Bumblebee</div>
      <div class="status-sub" id="statusSub">Isso só é necessário uma vez, ao ligar</div>
    </div>

    <button class="boot-btn" id="bootButton">Ligar o Bumblebee</button>

    <div class="volume-meter" id="volumeMeterWrap" style="display:none;">
      <div class="volume-fill" id="volumeFill"></div>
    </div>
  </div>

  <audio id="player"></audio>

  <details class="config">
    <summary>configuração</summary>
    <div class="config-panel">
      <div>
        <label for="webhookUrl">URL do webhook (n8n)</label>
        <input type="text" id="webhookUrl" value="https://n8n.inetiirati.tech/webhook/bobobi-fala">
      </div>

      <div>
        <label for="wakeEngine">Motor de wake word</label>
        <select id="wakeEngine">
          <option value="webspeech" selected>Web Speech API (ativo)</option>
          <option value="porcupine">Picovoice Porcupine (config. pendente)</option>
        </select>
      </div>

      <div class="row">
        <div>
          <label for="silenceMs">Silêncio p/ parar (ms)</label>
          <input type="number" id="silenceMs" value="1200">
        </div>
        <div>
          <label for="volumeThreshold">Sensibilidade (0-255)</label>
          <input type="number" id="volumeThreshold" value="18">
        </div>
      </div>

      <div>
        <label>Última transcrição ouvida (debug)</label>
        <div class="transcript-debug" id="transcriptDebug">—</div>
      </div>

      <div class="row">
        <div style="font-size:11px; color:var(--text-dim);">estado: <span id="stateDebug">boot</span></div>
      </div>

      <button class="save-btn" id="saveConfigBtn">Salvar e fechar</button>
    </div>
  </details>

<script>
(function () {
  const body = document.body;
  const orbButton = document.getElementById('orbButton');
  const bootButton = document.getElementById('bootButton');
  const ring = document.getElementById('ring');
  const statusLabel = document.getElementById('statusLabel');
  const statusSub = document.getElementById('statusSub');
  const player = document.getElementById('player');
  const webhookUrlInput = document.getElementById('webhookUrl');
  const wakeEngineSelect = document.getElementById('wakeEngine');
  const silenceMsInput = document.getElementById('silenceMs');
  const volumeThresholdInput = document.getElementById('volumeThreshold');
  const transcriptDebug = document.getElementById('transcriptDebug');
  const stateDebugEl = document.getElementById('stateDebug');
  const volumeMeterWrap = document.getElementById('volumeMeterWrap');
  const volumeFill = document.getElementById('volumeFill');
  const saveConfigBtn = document.getElementById('saveConfigBtn');
  const configDetails = document.querySelector('.config');

  let stream = null;
  let audioCtx = null;
  let analyser = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let wakeLock = null;
  let currentState = 'boot';
  let vadInterval = null;
  let recordingStartedAt = 0;
  let lastSpeechAt = 0;
  let heardSpeechYet = false;

  const STATES = {
    boot:       { label: 'Toque para ligar o Bumblebee', sub: 'Isso só é necessário uma vez, ao ligar', ring: false },
    wake_listen:{ label: 'Bumblebee está por perto',      sub: 'Diga "Bumblebee" pra conversar',            ring: true },
    recording:  { label: 'Ouvindo...',                 sub: '',                                        ring: true },
    thinking:   { label: 'Pensando...',                sub: 'Bip-bop, um instante',                    ring: true },
    speaking:   { label: 'Bumblebee está falando',         sub: '',                                        ring: true },
    error:      { label: 'Ops, algo deu errado',        sub: 'Voltando a escutar em instantes',         ring: false }
  };

  function setState(next, subOverride) {
    currentState = next;
    body.setAttribute('data-state', next);
    const cfg = STATES[next];
    statusLabel.textContent = cfg.label;
    statusSub.textContent = subOverride !== undefined ? subOverride : cfg.sub;
    ring.classList.toggle('active', cfg.ring);
    stateDebugEl.textContent = next;
  }

  function normalize(text) {
    return (text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  // =========================================================
  // Configuração persistente (fica salva no navegador deste
  // celular/dispositivo, entre recarregamentos da página)
  // =========================================================
  const CONFIG_STORAGE_KEY = 'bumblebee_config_v1';

  function loadSavedConfig() {
    try {
      const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
      if (!raw) return;
      const cfg = JSON.parse(raw);
      if (cfg.webhookUrl) webhookUrlInput.value = cfg.webhookUrl;
      if (cfg.wakeEngine) wakeEngineSelect.value = cfg.wakeEngine;
      if (cfg.silenceMs) silenceMsInput.value = cfg.silenceMs;
      if (cfg.volumeThreshold) volumeThresholdInput.value = cfg.volumeThreshold;
    } catch (e) {
      // localStorage indisponível (ex: preview dentro do Claude) - segue com os padrões do código
    }
  }

  function saveConfig() {
    try {
      localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify({
        webhookUrl: webhookUrlInput.value.trim(),
        wakeEngine: wakeEngineSelect.value,
        silenceMs: silenceMsInput.value,
        volumeThreshold: volumeThresholdInput.value
      }));
      return true;
    } catch (e) {
      return false;
    }
  }

  saveConfigBtn.addEventListener('click', () => {
    const ok = saveConfig();
    saveConfigBtn.textContent = ok ? 'Salvo!' : 'Não foi possível salvar';
    saveConfigBtn.classList.toggle('saved', ok);
    setTimeout(() => {
      saveConfigBtn.textContent = 'Salvar e fechar';
      saveConfigBtn.classList.remove('saved');
      configDetails.open = false;
    }, 700);
  });

  loadSavedConfig();

  // =========================================================
  // WAKE WORD ENGINES — camada trocável
  // Contrato: { start(), stop() } + chama onWakeWordDetected() quando ouvir "bumblebee"
  // =========================================================

  function createWebSpeechEngine(onWakeWordDetected) {
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionAPI) {
      throw new Error('Web Speech API não suportada neste navegador. Use Chrome no Android.');
    }

    const recognition = new SpeechRecognitionAPI();
    recognition.lang = 'pt-BR';
    recognition.continuous = true;
    recognition.interimResults = true;

    let shouldBeRunning = false;

    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript + ' ';
      }
      transcriptDebug.textContent = transcript.trim() || '—';

      if (normalize(transcript).includes('bumblebee')) {
        onWakeWordDetected();
      }
    };

    recognition.onerror = (event) => {
      // "no-speech" e "aborted" são esperados (aborted acontece toda vez que
      // paramos de propósito pra iniciar a gravação); só mostra erros reais
      if (event.error !== 'no-speech' && event.error !== 'aborted') {
        console.warn('Erro no reconhecimento de voz:', event.error);
        transcriptDebug.textContent = '[erro no reconhecimento: ' + event.error + ']';
      }
    };

    recognition.onend = () => {
      // o navegador para sozinho de tempos em tempos; reinicia se ainda deveríamos estar ouvindo
      if (shouldBeRunning) {
        try { recognition.start(); } catch (e) { /* já rodando, ignora */ }
      }
    };

    return {
      start() {
        shouldBeRunning = true;
        try { recognition.start(); } catch (e) { /* já rodando */ }
      },
      stop() {
        // espera o evento real de encerramento (mic liberado) em vez de um tempo fixo no escuro
        return new Promise((resolve) => {
          shouldBeRunning = false;
          recognition.addEventListener('end', () => resolve(), { once: true });
          try {
            recognition.stop();
          } catch (e) {
            resolve();
          }
        });
      }
    };
  }

  // ---------------------------------------------------------
  // TODO (quando a conta Picovoice for aprovada):
  // "Bumblebee" é uma palavra de ativação PRONTA do Porcupine (built-in) -
  // não precisa treinar nada nem baixar modelo em português, só:
  // 1. Adicionar via CDN/bundler: @picovoice/web-voice-processor e @picovoice/porcupine-web
  // 2. Baixar no Picovoice Console o arquivo .ppn pronto de "Bumblebee" (plataforma Web)
  //    (o modelo de idioma usado é o padrão em inglês, mesmo com o resto do app em português -
  //    a wake word em si é só reconhecimento fonético, não precisa entender o idioma)
  // 3. Preencher PICOVOICE_ACCESS_KEY abaixo
  // 4. Implementar createPorcupineEngine seguindo o mesmo contrato { start(), stop() }
  // 5. Trocar o <select id="wakeEngine"> pra 'porcupine' (ou fixar no código)
  // Me chama nessa hora que eu termino essa parte com você.
  // ---------------------------------------------------------
  const PICOVOICE_ACCESS_KEY = ''; // preencher depois de aprovado

  function createPorcupineEngine(onWakeWordDetected) {
    throw new Error('Motor Picovoice ainda não configurado. Use Web Speech API por enquanto.');
  }

  function getWakeEngine(onWakeWordDetected) {
    const choice = wakeEngineSelect.value;
    if (choice === 'porcupine') {
      return createPorcupineEngine(onWakeWordDetected);
    }
    return createWebSpeechEngine(onWakeWordDetected);
  }

  let wakeEngine = null;

  // =========================================================
  // Wake Lock
  // =========================================================
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (err) { /* segue sem wake lock */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && currentState !== 'boot') {
      requestWakeLock();
    }
  });

  // =========================================================
  // Áudio: captura + análise de volume (VAD simples)
  // =========================================================
  function setupAudioAnalysis() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
  }

  function getCurrentVolume() {
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i];
    return sum / data.length; // 0-255 aproximado
  }

  function pickMimeType() {
    const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
    for (const type of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
    }
    return '';
  }

  // =========================================================
  // Fluxo principal
  // =========================================================

  async function onWakeWordDetected() {
    if (currentState !== 'wake_listen') return;
    await wakeEngine.stop(); // aguarda o microfone ser realmente liberado

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      setupAudioAnalysis();
      startRecordingWithVAD();
    } catch (err) {
      console.error(err);
      setState('error', 'Não consegui acessar o microfone: ' + err.message);
      setTimeout(backToWakeListen, 2000);
    }
  }

  function startRecordingWithVAD() {
    setState('recording');
    volumeMeterWrap.style.display = 'block';
    audioChunks = [];
    heardSpeechYet = false;
    recordingStartedAt = Date.now();
    lastSpeechAt = Date.now();

    const mimeType = pickMimeType();
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = handleRecordingStop;
    mediaRecorder.start();

    const silenceMs = parseInt(silenceMsInput.value, 10) || 1200;
    const volumeThreshold = parseInt(volumeThresholdInput.value, 10) || 18;
    const MAX_DURATION_MS = 9000;
    const MAX_WAIT_FOR_SPEECH_MS = 4000;

    vadInterval = setInterval(() => {
      const volume = getCurrentVolume();
      volumeFill.style.width = Math.min(100, (volume / 100) * 100) + '%';
      const now = Date.now();

      if (volume > volumeThreshold) {
        heardSpeechYet = true;
        lastSpeechAt = now;
      }

      const elapsedSinceStart = now - recordingStartedAt;
      const elapsedSinceSpeech = now - lastSpeechAt;

      if (!heardSpeechYet && elapsedSinceStart > MAX_WAIT_FOR_SPEECH_MS) {
        // ninguém falou nada depois da wake word, desiste
        stopRecordingAndDiscard();
        return;
      }

      if (heardSpeechYet && elapsedSinceSpeech > silenceMs) {
        finishRecording();
        return;
      }

      if (elapsedSinceStart > MAX_DURATION_MS) {
        finishRecording();
      }
    }, 100);
  }

  function stopRecordingAndDiscard() {
    clearInterval(vadInterval);
    volumeMeterWrap.style.display = 'none';
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.onstop = null;
      mediaRecorder.stop();
    }
    backToWakeListen();
  }

  function finishRecording() {
    clearInterval(vadInterval);
    volumeMeterWrap.style.display = 'none';
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop(); // dispara handleRecordingStop
    }
  }

  async function handleRecordingStop() {
    setState('thinking');
    const mimeType = mediaRecorder.mimeType || 'audio/webm';
    const blob = new Blob(audioChunks, { type: mimeType });

    if (blob.size < 800) {
      backToWakeListen();
      return;
    }

    const extension = mimeType.includes('ogg') ? 'ogg' : mimeType.includes('mp4') ? 'm4a' : 'webm';
    const formData = new FormData();
    formData.append('audio', blob, `fala.${extension}`);

    try {
      const response = await fetch(webhookUrlInput.value.trim(), { method: 'POST', body: formData });
      if (!response.ok) throw new Error('Servidor respondeu ' + response.status);

      const responseBlob = await response.blob();
      if (responseBlob.size < 100) throw new Error('Resposta vazia');

      playResponse(responseBlob);
    } catch (err) {
      console.error(err);
      setState('error', err.message);
      setTimeout(backToWakeListen, 2500);
    }
  }

  function playResponse(blob) {
    const url = URL.createObjectURL(blob);
    player.src = url;
    setState('speaking');
    player.play().catch(() => { setState('error', 'Não consegui tocar o áudio'); });
    player.onended = () => {
      URL.revokeObjectURL(url);
      backToWakeListen();
    };
  }

  function backToWakeListen() {
    // libera o microfone da gravação por completo antes de voltar
    // a escutar a wake word, pra não disputar acesso ao mic
    if (stream) {
      stream.getTracks().forEach((track) => track.stop());
      stream = null;
    }
    if (audioCtx) {
      audioCtx.close().catch(() => {});
      audioCtx = null;
    }
    setState('wake_listen');
    transcriptDebug.textContent = '—';
    wakeEngine.start();
  }

  // toque manual no orb também dispara (útil pra testes, sem precisar falar)
  orbButton.addEventListener('click', () => {
    if (currentState === 'wake_listen') {
      onWakeWordDetected();
    }
  });

  // =========================================================
  // Boot — precisa de 1 toque humano por causa de permissões do navegador
  // =========================================================
  bootButton.addEventListener('click', async () => {
    try {
      bootButton.disabled = true;
      bootButton.textContent = 'Ligando...';

      await requestWakeLock();

      wakeEngine = getWakeEngine(onWakeWordDetected);
      wakeEngine.start();

      bootButton.style.display = 'none';
      orbButton.style.display = 'flex';
      setState('wake_listen');
    } catch (err) {
      console.error(err);
      statusLabel.textContent = 'Não consegui acessar o microfone';
      statusSub.textContent = err.message;
      bootButton.disabled = false;
      bootButton.textContent = 'Tentar de novo';
    }
  });

  setState('boot');
})();
</script>
</body>
</html>
