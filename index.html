<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bobobi</title>
<style>
  :root {
    --bg: #14121f;
    --bg-soft: #1e1b2e;
    --panel: #26223a;
    --accent: #ff8a3d;
    --accent-soft: #ffb066;
    --listen: #4fd6c4;
    --think: #ffd166;
    --speak: #ff8a3d;
    --error: #ff5d5d;
    --text: #f5f2ff;
    --text-dim: #a89fc7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    -webkit-tap-highlight-color: transparent;
  }

  .brand {
    position: absolute;
    top: 20px;
    left: 24px;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: 100%;
    max-width: 420px;
  }

  .orb-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.08);
    transition: border-color 0.4s ease;
  }

  .ring.active {
    animation: pulse-ring 1.6s ease-out infinite;
  }

  @keyframes pulse-ring {
    0%   { transform: scale(0.92); opacity: 0.9; }
    70%  { transform: scale(1.25); opacity: 0; }
    100% { transform: scale(1.25); opacity: 0; }
  }

  .orb {
    position: relative;
    width: 168px;
    height: 168px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-soft), var(--accent) 60%, #c9591a 100%);
    box-shadow: 0 0 0 rgba(255,138,61,0);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    transition: box-shadow 0.4s ease, background 0.4s ease, transform 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .orb:active {
    transform: scale(0.97);
  }

  .orb-icon {
    width: 56px;
    height: 56px;
    fill: rgba(20, 18, 31, 0.85);
  }

  /* estado: ouvindo */
  body[data-state="listening"] .orb {
    background: radial-gradient(circle at 35% 30%, #8ff5e6, var(--listen) 60%, #16a08f 100%);
  }
  body[data-state="listening"] .ring.active {
    border-color: var(--listen);
  }

  /* estado: pensando */
  body[data-state="thinking"] .orb {
    background: radial-gradient(circle at 35% 30%, #ffe9a8, var(--think) 60%, #c99a1c 100%);
  }
  body[data-state="thinking"] .ring.active {
    border-color: var(--think);
  }
  body[data-state="thinking"] .orb {
    animation: think-spin 1.1s linear infinite;
  }
  @keyframes think-spin {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.25); }
  }

  /* estado: falando */
  body[data-state="speaking"] .orb {
    background: radial-gradient(circle at 35% 30%, var(--accent-soft), var(--speak) 60%, #c9591a 100%);
    animation: speak-bounce 0.5s ease-in-out infinite;
  }
  body[data-state="speaking"] .ring.active {
    border-color: var(--speak);
  }
  @keyframes speak-bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }

  /* estado: erro */
  body[data-state="error"] .orb {
    background: radial-gradient(circle at 35% 30%, #ffb3b3, var(--error) 60%, #a83030 100%);
  }

  .status-label {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.01em;
    min-height: 28px;
    text-align: center;
  }

  .status-sub {
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
    min-height: 18px;
    max-width: 340px;
  }

  .config {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 460px;
  }

  .config summary {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    cursor: pointer;
    list-style: none;
    padding: 6px;
  }
  .config summary::-webkit-details-marker { display: none; }

  .config-panel {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .config-panel label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }

  .config-panel input {
    background: var(--bg-soft);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 13px;
    width: 100%;
  }

  .badge {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }

  .wake-indicator {
    position: absolute;
    top: 20px;
    right: 24px;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #555;
  }
  .dot.on { background: var(--listen); }

  audio { display: none; }
</style>
</head>
<body data-state="idle">

  <div class="brand">Bobobi</div>
  <div class="wake-indicator"><span class="dot" id="wakeLockDot"></span><span id="wakeLockLabel">tela</span></div>

  <div class="stage">
    <div class="orb-wrap">
      <div class="ring" id="ring"></div>
      <button class="orb" id="orbButton" aria-label="Falar com o Bobobi">
        <svg class="orb-icon" id="orbIcon" viewBox="0 0 24 24">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
        </svg>
      </button>
    </div>

    <div>
      <div class="status-label" id="statusLabel">Toque para falar</div>
      <div class="status-sub" id="statusSub">O Bobobi está esperando</div>
    </div>
  </div>

  <audio id="player"></audio>

  <details class="config">
    <summary>configuração</summary>
    <div class="config-panel">
      <div>
        <label for="webhookUrl">URL do webhook (n8n)</label>
        <input type="text" id="webhookUrl" value="https://n8n.inetiirati.tech/webhook-test/bobobi-fala">
      </div>
      <div class="badge">
        <span id="micStatus">microfone: verificando...</span>
        <span id="stateDebug">idle</span>
      </div>
    </div>
  </details>

<script>
(function () {
  const body = document.body;
  const orbButton = document.getElementById('orbButton');
  const ring = document.getElementById('ring');
  const statusLabel = document.getElementById('statusLabel');
  const statusSub = document.getElementById('statusSub');
  const player = document.getElementById('player');
  const webhookUrlInput = document.getElementById('webhookUrl');
  const micStatusEl = document.getElementById('micStatus');
  const stateDebugEl = document.getElementById('stateDebug');
  const wakeLockDot = document.getElementById('wakeLockDot');
  const wakeLockLabel = document.getElementById('wakeLockLabel');

  let mediaRecorder = null;
  let audioChunks = [];
  let stream = null;
  let wakeLock = null;
  let currentState = 'idle';

  const STATES = {
    idle:      { label: 'Toque para falar',      sub: 'O Bobobi está esperando', ring: false },
    listening: { label: 'Ouvindo...',             sub: 'Toque de novo quando terminar', ring: true },
    thinking:  { label: 'Pensando...',            sub: 'Bip-bop, um instante', ring: true },
    speaking:  { label: 'Bobobi está falando',    sub: '', ring: true },
    error:     { label: 'Ops, algo deu errado',   sub: 'Toque para tentar de novo', ring: false }
  };

  function setState(next, subOverride) {
    currentState = next;
    body.setAttribute('data-state', next);
    const cfg = STATES[next];
    statusLabel.textContent = cfg.label;
    statusSub.textContent = subOverride !== undefined ? subOverride : cfg.sub;
    ring.classList.toggle('active', cfg.ring);
    stateDebugEl.textContent = next;
  }

  // ---- Wake Lock (mantém a tela ligada) ----
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLockDot.classList.add('on');
        wakeLockLabel.textContent = 'tela ativa';
        wakeLock.addEventListener('release', () => {
          wakeLockDot.classList.remove('on');
          wakeLockLabel.textContent = 'tela';
        });
      }
    } catch (err) {
      wakeLockLabel.textContent = 'sem wake lock';
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && currentState !== 'idle') {
      requestWakeLock();
    }
  });

  // ---- Microfone ----
  async function ensureMic() {
    if (stream) return stream;
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micStatusEl.textContent = 'microfone: liberado';
    return stream;
  }

  function pickMimeType() {
    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/ogg;codecs=opus',
      'audio/mp4'
    ];
    for (const type of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
    }
    return '';
  }

  async function startRecording() {
    await requestWakeLock();
    await ensureMic();
    audioChunks = [];
    const mimeType = pickMimeType();
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = handleRecordingStop;
    mediaRecorder.start();
    setState('listening');
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
  }

  async function handleRecordingStop() {
    setState('thinking');
    const mimeType = mediaRecorder.mimeType || 'audio/webm';
    const blob = new Blob(audioChunks, { type: mimeType });

    if (blob.size < 500) {
      setState('error', 'Não captei nenhum áudio. Fale mais perto do microfone.');
      setTimeout(() => setState('idle'), 2500);
      return;
    }

    const extension = mimeType.includes('ogg') ? 'ogg' : mimeType.includes('mp4') ? 'm4a' : 'webm';
    const formData = new FormData();
    formData.append('audio', blob, `fala.${extension}`);

    try {
      const response = await fetch(webhookUrlInput.value.trim(), {
        method: 'POST',
        body: formData
      });

      if (!response.ok) {
        throw new Error('Servidor respondeu com status ' + response.status);
      }

      const responseBlob = await response.blob();
      if (responseBlob.size < 100) {
        throw new Error('Resposta veio vazia');
      }

      playResponse(responseBlob);
    } catch (err) {
      console.error(err);
      setState('error', err.message);
      setTimeout(() => setState('idle'), 3000);
    }
  }

  function playResponse(blob) {
    const url = URL.createObjectURL(blob);
    player.src = url;

    // mic gating: garante que não gravamos por cima da fala do Bobobi
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }

    setState('speaking');
    player.play().catch((err) => {
      setState('error', 'Toque na tela pra liberar o áudio (política do navegador)');
    });

    player.onended = () => {
      URL.revokeObjectURL(url);
      setState('idle');
    };
  }

  // ---- Interação: toque pra iniciar, toque de novo pra parar ----
  orbButton.addEventListener('click', () => {
    if (currentState === 'idle' || currentState === 'error') {
      startRecording().catch((err) => {
        console.error(err);
        micStatusEl.textContent = 'microfone: negado';
        setState('error', 'Não consegui acessar o microfone. Verifique a permissão.');
      });
    } else if (currentState === 'listening') {
      stopRecording();
    }
    // durante "thinking" e "speaking" o botão não faz nada, propositalmente
  });

  // checagem inicial de permissão (não força o prompt ainda)
  if (navigator.permissions) {
    navigator.permissions.query({ name: 'microphone' }).then((result) => {
      micStatusEl.textContent = 'microfone: ' + result.state;
    }).catch(() => {
      micStatusEl.textContent = 'microfone: toque pra verificar';
    });
  }

  setState('idle');
})();
</script>
</body>
</html>
